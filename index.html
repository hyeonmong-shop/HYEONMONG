<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>永夢 | 영몽</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <a
      href="#"
      class="logo"
    >
      永夢
    </a>


    <button
      class="cart-btn"
      id="open-cart"
      type="button"
    >

      장바구니

      <span id="cart-count">
        0
      </span>

    </button>

  </header>



  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <p class="hero-symbol">
      永夢
    </p>


    <h1>
      永 夢
    </h1>


    <p>
      몽환과 유랑이 머무는 공간
    </p>


    <a
      href="#collection"
      class="hero-button"
    >
      SHOP NOW
    </a>

  </section>



  <!-- =========================
       COLLECTION
  ========================== -->

  <main
    class="container"
    id="collection"
  >

    <p class="collection-subtitle">
      HYEONMONG OBJECT
    </p>


    <h2 class="section-title">
      COLLECTION
    </h2>


    <div
      class="product-grid"
      id="product-grid"
    >

      <!-- 상품은 script.js에서 자동으로 표시됩니다 -->

    </div>

  </main>



  <!-- =========================
       PRODUCT DETAIL
  ========================== -->

  <div
    class="modal-overlay"
    id="detail-modal"
  >

    <div class="modal-content">


      <button
        class="close-btn"
        id="close-detail"
        type="button"
      >
        &times;
      </button>


      <div class="detail-body">


        <img
          id="detail-img"
          src="AED2C668-95D1-4688-B695-084FE096312A.jpeg"
          alt="流浪 핑크 라이터"
        >


        <div class="detail-info">


          <p class="product-category">
            HYEONMONG / LIGHTER
          </p>


          <h2 id="detail-title">
            流浪 핑크 라이터
          </h2>


          <p
            class="detail-price"
            id="detail-price"
          >
            5,000원
          </p>


          <p
            class="detail-desc"
            id="detail-desc"
          >
            핑크 컬러의 라이터에
            영몽의 감성을 담았습니다.
          </p>


          <button
            class="primary-btn"
            id="add-to-cart-btn"
            type="button"
          >
            장바구니 담기
          </button>


        </div>

      </div>

    </div>

  </div>



  <!-- =========================
       CART
  ========================== -->

  <div
    class="modal-overlay"
    id="cart-modal"
  >

    <div class="cart-content">


      <div class="cart-header">


        <div>

          <p class="product-category">
            HYEONMONG
          </p>


          <h2>
            장바구니
          </h2>

        </div>


        <button
          class="close-btn"
          id="close-cart"
          type="button"
        >
          &times;
        </button>


      </div>



      <div
        class="cart-items"
        id="cart-items"
      >

      </div>



      <div class="cart-footer">


        <div class="cart-total">

          <span>
            총 상품금액
          </span>


          <strong id="cart-total-price">
            0원
          </strong>

        </div>


        <button
          class="primary-btn"
          id="checkout-btn"
          type="button"
        >
          주문하기
        </button>


      </div>

    </div>

  </div>



  <!-- =========================
       ORDER
  ========================== -->

  <div
    class="modal-overlay"
    id="order-modal"
  >

    <div class="cart-content">


      <div class="cart-header">


        <div>

          <p class="product-category">
            HYEONMONG
          </p>


          <h2>
            주문하기
          </h2>

        </div>


        <button
          class="close-btn"
          id="close-order"
          type="button"
        >
          &times;
        </button>

      </div>



      <!-- 주문자 정보 -->

      <div
        style="
          margin-bottom:25px;
        "
      >


        <label>
          이름
        </label>


        <input
          id="order-name"
          type="text"
          placeholder="받으실 분 이름"
          style="
            width:100%;
            padding:13px;
            margin-top:8px;
            margin-bottom:15px;
            border:1px solid #eadde1;
            font-family:inherit;
          "
        >



        <label>
          연락처
        </label>


        <input
          id="order-phone"
          type="tel"
          placeholder="010-0000-0000"
          style="
            width:100%;
            padding:13px;
            margin-top:8px;
            margin-bottom:15px;
            border:1px solid #eadde1;
            font-family:inherit;
          "
        >



        <label>
          배송지
        </label>


        <input
          id="order-address"
          type="text"
          placeholder="주소를 입력해주세요"
          style="
            width:100%;
            padding:13px;
            margin-top:8px;
            border:1px solid #eadde1;
            font-family:inherit;
          "
        >

      </div>



      <!-- 주문 금액 -->

      <div class="cart-footer">


        <div class="cart-total">

          <span>
            결제 예정 금액
          </span>


          <strong id="order-total">
            0원
          </strong>

        </div>


        <button
          class="primary-btn"
          id="payment-btn"
          type="button"
        >
          결제하기
        </button>


      </div>

    </div>

  </div>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">


    <div class="footer-logo">
      永夢
    </div>


    <p>
      영원한 꿈을 담다.
    </p>


    <small>
      © 2026 HYEONMONG
    </small>


  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>


</body>

</html>
