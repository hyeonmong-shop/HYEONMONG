<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>永夢 | 주문조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7fa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #333;
    }

    .container {
      width: calc(100% - 40px);
      max-width: 430px;

      margin: 0 auto;
      padding: 55px 0;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .box {
      background: white;
      border: 1px solid #f0dce3;
      border-radius: 18px;

      padding: 25px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.04);
    }

    label {
      display: block;
      margin-bottom: 7px;

      font-size: 13px;
      color: #777;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border:
        1px solid #e8d8de;

      border-radius: 10px;

      outline: none;

      font-size: 14px;

      margin-bottom: 18px;
    }

    input:focus {
      border-color: #d9a8b8;
    }

    button {
      width: 100%;
      height: 50px;

      border: none;
      border-radius: 10px;

      background: #333;
      color: white;

      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .error {
      margin-top: 15px;

      text-align: center;

      color: #d44;

      font-size: 13px;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .info {
      background: #fff7fa;
      border-radius: 12px;

      padding: 17px;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;

      gap: 15px;

      padding: 7px 0;

      font-size: 14px;
    }

    .label {
      color: #888;
      white-space: nowrap;
    }

    .value {
      text-align: right;

      font-weight: 600;

      word-break: break-all;
    }

    .items {
      margin-top: 15px;

      padding-top: 15px;

      border-top:
        1px solid #f0dce3;
    }

    .item {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 6px 0;

      font-size: 14px;
    }

    .shipping {
      margin-top: 15px;

      padding: 17px;

      border:
        1px solid #f0dce3;

      border-radius: 12px;
    }

    .shipping-title {
      font-size: 15px;

      font-weight: 600;

      margin-bottom: 10px;
    }

    .tracking {
      margin-top: 12px;

      padding: 12px;

      background: white;

      border-radius: 8px;

      font-size: 13px;

      word-break: break-all;
    }

    .refresh-button {
      margin-top: 10px;

      background: #333;

      height: 44px;

      font-size: 14px;
    }

    .tracking-message {
      margin-top: 12px;

      padding: 12px;

      background: white;

      border-radius: 8px;

      color: #777;

      font-size: 13px;

      line-height: 1.6;
    }

    .event {
      margin-top: 12px;

      padding: 13px;

      background: white;

      border-radius: 8px;

      font-size: 13px;

      line-height: 1.6;
    }

    .event-title {
      font-weight: 600;

      margin-bottom: 4px;
    }

    .event-meta {
      color: #999;

      font-size: 12px;
    }

    .notice {
      margin-top: 20px;

      text-align: center;

      color: #999;

      font-size: 12px;

      line-height: 1.6;
    }
  </style>

</head>


<body>

  <main class="container">

    <div class="logo">
      永夢
    </div>

    <div class="subtitle">
      주문조회
    </div>


    <div class="box">

      <label for="order-id">
        주문번호
      </label>

      <input
        id="order-id"
        type="text"
        placeholder="주문번호를 입력해주세요."
      >


      <label for="phone">
        주문자 전화번호
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="01012345678"
      >


      <button
        id="lookup-button"
        type="button"
      >
        주문 조회
      </button>


      <div
        id="error"
        class="error"
      ></div>


      <div id="result">

        <div class="result-title">
          주문 정보
        </div>


        <div class="info">

          <div class="row">

            <span class="label">
              주문번호
            </span>

            <span
              id="result-order-id"
              class="value"
            ></span>

          </div>


          <div class="row">

            <span class="label">
              주문자
            </span>

            <span
              id="result-name"
              class="value"
            ></span>

          </div>


          <div class="row">

            <span class="label">
              결제금액
            </span>

            <span
              id="result-amount"
              class="value"
            ></span>

          </div>


          <div class="row">

            <span class="label">
              주문상태
            </span>

            <span
              id="result-status"
              class="value"
            ></span>

          </div>


          <div class="items">

            <div id="result-items"></div>

          </div>

        </div>


        <div class="shipping">

          <div class="shipping-title">
            배송정보
          </div>


          <div class="row">

            <span class="label">
              배송상태
            </span>

            <span
              id="delivery-status"
              class="value"
            >
              상품준비중
            </span>

          </div>


          <div
            class="row"
            id="carrier-row"
            style="display:none;"
          >

            <span class="label">
              택배사
            </span>

            <span
              id="carrier"
              class="value"
            ></span>

          </div>


          <div
            id="tracking-area"
            style="display:none;"
          >

            <div class="tracking">

              송장번호<br>

              <strong
                id="tracking-number"
              ></strong>

            </div>


            <div
              id="tracking-message"
              class="tracking-message"
              style="display:none;"
            ></div>


            <div
              id="latest-event"
              class="event"
              style="display:none;"
            >

              <div class="event-title">
                최근 배송정보
              </div>

              <div id="event-status"></div>

              <div
                id="event-location"
                class="event-meta"
              ></div>

              <div
                id="event-time"
                class="event-meta"
              ></div>

            </div>


            <button
              id="refresh-tracking-button"
              class="refresh-button"
              type="button"
            >
              배송상태 새로고침
            </button>

          </div>

        </div>


        <div class="notice">
          배송상태는 조회할 때마다 택배사 정보로 업데이트됩니다.
        </div>

      </div>

    </div>

  </main>


  <script>

    const WORKER_URL =
      "https://hyeonmong.hyoeunan240.workers.dev";


    const lookupButton =
      document.getElementById(
        "lookup-button"
      );


    const refreshTrackingButton =
      document.getElementById(
        "refresh-tracking-button"
      );


    const error =
      document.getElementById(
        "error"
      );


    const result =
      document.getElementById(
        "result"
      );


    const trackingArea =
      document.getElementById(
        "tracking-area"
      );


    const carrierRow =
      document.getElementById(
        "carrier-row"
      );


    const trackingMessage =
      document.getElementById(
        "tracking-message"
      );


    const latestEvent =
      document.getElementById(
        "latest-event"
      );


    let currentOrderId = "";

    let currentPhone = "";

    let currentTrackingNumber = "";


    // =========================
    // 주문 조회
    // =========================

    lookupButton.onclick =
      async function() {

        error.textContent = "";

        result.style.display =
          "none";


        const orderId =
          document
            .getElementById("order-id")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        if (!orderId) {

          error.textContent =
            "주문번호를 입력해주세요.";

          return;

        }


        if (!phone) {

          error.textContent =
            "전화번호를 입력해주세요.";

          return;

        }


        currentOrderId =
          orderId;

        currentPhone =
          phone;


        lookupButton.disabled =
          true;

        lookupButton.textContent =
          "조회 중...";


        try {

          const response =
            await fetch(
              WORKER_URL +
              "/api/orders/lookup",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    orderId:
                      orderId,

                    phone:
                      phone
                  })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.ok
          ) {

            throw new Error(
              data.message ||
              "주문을 찾을 수 없습니다."
            );

          }


          const order =
            data.order;


          document.getElementById(
            "result-order-id"
          ).textContent =
            order.orderId;


          document.getElementById(
            "result-name"
          ).textContent =
            order.customerName;


          document.getElementById(
            "result-amount"
          ).textContent =
            Number(
              order.amount
            ).toLocaleString(
              "ko-KR"
            ) + "원";


          document.getElementById(
            "result-status"
          ).textContent =
            order.status === "PAID"
              ? "결제완료"
              : order.status;


          const items =
            document.getElementById(
              "result-items"
            );


          items.innerHTML = "";


          if (
            Array.isArray(order.items)
          ) {

            order.items.forEach(
              function(item) {

                const div =
                  document.createElement(
                    "div"
                  );


                div.className =
                  "item";


                const nameSpan =
                  document.createElement(
                    "span"
                  );


                nameSpan.textContent =
                  item.name +
                  " × " +
                  item.quantity;


                const priceSpan =
                  document.createElement(
                    "span"
                  );


                priceSpan.textContent =
                  (
                    item.price *
                    item.quantity
                  ).toLocaleString(
                    "ko-KR"
                  ) + "원";


                div.appendChild(
                  nameSpan
                );

                div.appendChild(
                  priceSpan
                );


                items.appendChild(
                  div
                );

              }
            );

          }


          currentTrackingNumber =
            order.trackingNumber || "";


          document.getElementById(
            "delivery-status"
          ).textContent =
            order.deliveryStatus ||
            "상품준비중";


          if (
            order.carrier &&
            currentTrackingNumber
          ) {

            carrierRow.style.display =
              "flex";


            trackingArea.style.display =
              "block";


            document.getElementById(
              "carrier"
            ).textContent =
              order.carrier;


            document.getElementById(
              "tracking-number"
            ).textContent =
              currentTrackingNumber;


            trackingMessage.style.display =
              "none";


            latestEvent.style.display =
              "none";


            await refreshTracking();

          } else {

            carrierRow.style.display =
              "none";


            trackingArea.style.display =
              "none";

          }


          result.style.display =
            "block";


        } catch (e) {

          error.textContent =
            e.message ||
            "주문 조회 중 오류가 발생했습니다.";

        } finally {

          lookupButton.disabled =
            false;


          lookupButton.textContent =
            "주문 조회";

        }

      };


    // =========================
    // 실시간 배송상태 조회
    // =========================

    async function refreshTracking() {

      if (
        !currentOrderId ||
        !currentPhone ||
        !currentTrackingNumber
      ) {

        return;

      }


      refreshTrackingButton.disabled =
        true;


      refreshTrackingButton.textContent =
        "배송상태 확인 중...";


      trackingMessage.style.display =
        "none";


      latestEvent.style.display =
        "none";


      try {

        const response =
          await fetch(
            WORKER_URL +
            "/api/orders/tracking",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  orderId:
                    currentOrderId,

                  phone:
                    currentPhone

                })

            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.message ||
            "배송정보를 불러오지 못했습니다."
          );

        }


        if (
          data.trackingRegistered ===
          false
        ) {

          document.getElementById(
            "delivery-status"
          ).textContent =
            data.deliveryStatus ||
            "상품준비중";


          return;

        }


        document.getElementById(
          "delivery-status"
        ).textContent =
          data.deliveryStatus ||
          "확인 불가";


        if (
          data.carrier
        ) {

          document.getElementById(
            "carrier"
          ).textContent =
            data.carrier;

        }


        if (
          data.trackingNumber
        ) {

          currentTrackingNumber =
            data.trackingNumber;


          document.getElementById(
            "tracking-number"
          ).textContent =
            data.trackingNumber;

        }


        if (
          data.lastEvent
        ) {

          latestEvent.style.display =
            "block";


          document.getElementById(
            "event-status"
          ).textContent =
            data.lastEvent.statusText ||
            data.deliveryStatus ||
            "";


          document.getElementById(
            "event-location"
          ).textContent =
            data.lastEvent.location
              ? "위치: " +
                data.lastEvent.location
              : "";


          document.getElementById(
            "event-time"
          ).textContent =
            data.lastEvent.occurredAt
              ? "시간: " +
                formatDate(
                  data.lastEvent.occurredAt
                )
              : "";

        }


        if (
          data.message
        ) {

          trackingMessage.style.display =
            "block";


          trackingMessage.textContent =
            data.message;

        }


      } catch (e) {

        trackingMessage.style.display =
          "block";


        trackingMessage.textContent =
          e.message ||
          "배송정보를 불러오지 못했습니다.";

      } finally {

        refreshTrackingButton.disabled =
          false;


        refreshTrackingButton.textContent =
          "배송상태 새로고침";

      }

    }


    // =========================
    // 배송상태 새로고침 버튼
    // =========================

    refreshTrackingButton.onclick =
      function() {

        refreshTracking();

      };


    // =========================
    // 날짜 표시
    // =========================

    function formatDate(
      value
    ) {

      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return date.toLocaleString(
        "ko-KR",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }

  </script>

</body>

</html>
