<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>永夢 | 결제 완료</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7fa;
      font-family: sans-serif;
      color: #333;
    }

    .box {
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 40px 25px;
      box-sizing: border-box;
      text-align: center;
      background: white;
      border: 1px solid #f0dce3;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    .logo {
      font-size: 28px;
      margin-bottom: 25px;
      letter-spacing: 3px;
    }

    .check {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #f8dce6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 24px;
    }

    p {
      line-height: 1.7;
      color: #666;
      margin: 8px 0;
    }

    .order-info {
      margin-top: 25px;
      padding: 18px;
      background: #fff7fa;
      border-radius: 12px;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      font-size: 14px;
    }

    .info-label {
      color: #888;
      white-space: nowrap;
    }

    .info-value {
      color: #333;
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }

    .notice {
      margin-top: 22px;
      font-size: 13px;
      color: #999;
    }

    .error {
      color: #d44;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">永夢</div>

    <div id="check" class="check">
      ✓
    </div>

    <h1 id="title">
      결제 승인 중입니다.
    </h1>

    <p id="message">
      잠시만 기다려주세요.
    </p>

    <div id="order-info" class="order-info" style="display: none;">

      <div class="info-row">
        <span class="info-label">
          주문번호
        </span>

        <span
          id="order-id"
          class="info-value"
        ></span>
      </div>

      <div class="info-row">
        <span class="info-label">
          결제금액
        </span>

        <span
          id="amount"
          class="info-value"
        ></span>
      </div>

    </div>

    <p id="notice" class="notice" style="display: none;">
      주문해주셔서 감사합니다.
    </p>

  </div>


  <script>

    async function confirmPayment() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const paymentKey =
        params.get("paymentKey");

      const orderId =
        params.get("orderId");

      const amount =
        params.get("amount");


      // ==============================
      // 결제 승인 정보 확인
      // ==============================

      if (
        !paymentKey ||
        !orderId ||
        !amount
      ) {

        document.getElementById(
          "check"
        ).textContent = "×";

        document.getElementById(
          "check"
        ).style.background = "#f5dddd";

        document.getElementById(
          "title"
        ).textContent =
          "결제 승인 오류";

        document.getElementById(
          "message"
        ).textContent =
          "결제 승인에 필요한 정보가 없습니다.";

        document.getElementById(
          "message"
        ).className = "error";

        return;
      }


      try {

        // ==============================
        // Worker에 결제 승인 요청
        // ==============================

        const response =
          await fetch(
            "https://hyeonmong.hyoeunan240.workers.dev/api/payments/confirm",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                paymentKey:
                  paymentKey,

                orderId:
                  orderId,

                amount:
                  Number(amount)
              })
            }
          );


        const result =
          await response.json();


        // ==============================
        // 승인 실패
        // ==============================

        if (
          !response.ok ||
          !result.ok
        ) {

          throw new Error(
            result.message ||
            "결제 승인에 실패했습니다."
          );

        }


        // ==============================
        // 결제 승인 성공
        // ==============================

        document.getElementById(
          "check"
        ).textContent = "✓";

        document.getElementById(
          "title"
        ).textContent =
          "결제가 완료되었습니다.";

        document.getElementById(
          "message"
        ).textContent =
          "주문이 정상적으로 접수되었습니다.";


        // 주문번호 표시
        document.getElementById(
          "order-id"
        ).textContent =
          orderId;


        // 결제금액 표시
        document.getElementById(
          "amount"
        ).textContent =
          Number(amount).toLocaleString(
            "ko-KR"
          ) + "원";


        // 주문 정보 표시
        document.getElementById(
          "order-info"
        ).style.display =
          "block";


        // 안내 문구 표시
        document.getElementById(
          "notice"
        ).style.display =
          "block";


      } catch (error) {

        console.error(
          "결제 승인 오류:",
          error
        );


        document.getElementById(
          "check"
        ).textContent = "×";

        document.getElementById(
          "check"
        ).style.background = "#f5dddd";

        document.getElementById(
          "title"
        ).textContent =
          "결제 승인 오류";

        document.getElementById(
          "message"
        ).textContent =
          error.message ||
          "결제 승인 중 오류가 발생했습니다.";

        document.getElementById(
          "message"
        ).className =
          "error";

      }

    }


    confirmPayment();

  </script>

</body>
</html>
