<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>永夢 | 결제 완료</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7fa;
      font-family: sans-serif;
      color: #333;
    }

    .box {
      width: calc(100% - 40px);
      max-width: 420px;
      padding: 40px 25px;
      box-sizing: border-box;
      text-align: center;
      background: white;
      border: 1px solid #f0dce3;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      line-height: 1.7;
      color: #666;
    }

    .error {
      color: #d44;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1 id="title">결제 승인 중입니다.</h1>

    <p id="message">
      잠시만 기다려주세요.
    </p>

  </div>


  <script>

    async function confirmPayment() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const paymentKey =
        params.get("paymentKey");

      const orderId =
        params.get("orderId");

      const amount =
        params.get("amount");


      // 필수값 확인
      if (
        !paymentKey ||
        !orderId ||
        !amount
      ) {

        document.getElementById("title")
          .textContent =
          "결제 승인 오류";

        document.getElementById("message")
          .textContent =
          "결제 승인에 필요한 정보가 없습니다.";

        document.getElementById("message")
          .className = "error";

        return;
      }


      try {

        const response =
          await fetch(
            "https://hyeonmong.hyoeunan240.workers.dev/api/payments/confirm",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                paymentKey:
                  paymentKey,

                orderId:
                  orderId,

                amount:
                  Number(amount)
              })
            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.ok
        ) {

          throw new Error(
            result.message ||
            "결제 승인에 실패했습니다."
          );
        }


        // 결제 승인 성공
        document.getElementById("title")
          .textContent =
          "결제가 완료되었습니다.";

        document.getElementById("message")
          .textContent =
          "주문이 정상적으로 접수되었습니다.";

      } catch (error) {

        console.error(
          "결제 승인 오류:",
          error
        );

        document.getElementById("title")
          .textContent =
          "결제 승인 오류";

        document.getElementById("message")
          .textContent =
          error.message ||
          "결제 승인 중 오류가 발생했습니다.";

        document.getElementById("message")
          .className = "error";
      }
    }


    confirmPayment();

  </script>

</body>
</html>
